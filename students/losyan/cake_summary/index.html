
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title id="title">Piece of Cake</title>

    <link rel="stylesheet" href="static/style.css">
</head>

<body>

    <h1 class="cake-title">
        This is a small cakes website, enjoy the experience!
    </h1>

    <table class="cake-table" id="cakeTable">

        <thead class="cake-table-header">
            <tr>
                <th>Image</th>
                <th>Name</th>
                <th>Price</th>
            </tr>
        </thead>

        <tbody class="cake-table-body">

            <tr>
                <td>
                    <img src="static/image1.jpg"
                         alt="Chocolate Cake"
                         width="100">
                </td>
                <td>Chocolate Cake</td>
                <td>$10</td>
            </tr>

            <tr>
                <td>
                    <img src="static/image2.jpg"
                         alt="Vanilla Cake"
                         width="100">
                </td>
                <td>Vanilla Cake</td>
                <td>$12</td>
            </tr>

            <tr>
                <td>
                    <img src="static/image3.jpg"
                         alt="Strawberry Cake"
                         width="100">
                </td>
                <td>Strawberry Cake</td>
                <td>$15</td>
            </tr>

        </tbody>
    </table>

    <div class="filter">
        <input
            type="number"
            id="budget"
            placeholder="Enter your budget"
        >

        <button id="filterButton"
                class="filter-button"
                onclick="filterCakes()">
            Filter Cakes
        </button>
    </div>

    <p id="error_message" class="error-message"></p>

    <script src="static/script.js"></script>

</body>
</html>
