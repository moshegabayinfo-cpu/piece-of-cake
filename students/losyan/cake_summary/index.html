
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Piece of Cake</title>

    <link rel="stylesheet" href="static/style.css">
</head>

<body>

    <h1 class="cake-title">Piece of Cake</h1>

    <table class="cake-table" id="cakeTable">

        <thead class="cake-table-header">
            <tr>
                <th>שם העוגה</th>
                <th>מחיר</th>
            </tr>
        </thead>

        <tbody class="cake-table-body">

            <tr>
                <td>עוגת שוקולד</td>
                <td>140 ₪</td>
            </tr>

            <tr>
                <td>עוגת גבינה</td>
                <td>160 ₪</td>
            </tr>

            <tr>
                <td>עוגת לימון</td>
                <td>100 ₪</td>
            </tr>

        </tbody>
    </table>

    <div class="filter">

        <label for="budget">הכניסי את התקציב שלך (בש״ח):</label>

        <input
            type="number"
            id="budget"
            placeholder="הכניסי תקציב"
        >

        <button
            id="filterButton"
            class="filter-button"
            onclick="filterCakes()">
            סינון עוגות
        </button>

    </div>

    <p id="error_message" class="error-message"></p>

    <script src="static/script.js"></script>

</body>
</html>
